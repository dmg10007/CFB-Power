[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-power"
version = "0.1.0"
description = "Team-stat-driven college football score forecasting pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1.0",
  "httpx>=0.27.0",
  "joblib>=1.4.2",
  "numpy>=2.1.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "pyarrow>=17.0.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "scikit-learn>=1.5.2",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.6.9",
]

[project.scripts]
cfb-power = "cfb_power.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
